# Check the content, then publish the site to GitHub Pages.
# One-time setup on GitHub: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Check content and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Deploys of main run one at a time; pull-request checks get their own group so they
# can never cancel or delay a pending deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  check:
    name: Check content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Same rules as tools/validate.html. Any error stops the deploy below.
      - run: node tools/validate-cli.mjs --public-only
      # The check above only reads packs listed in a manifest. This also catches copied
      # items in any other file under data/ that the deploy would publish.
      - name: Block copied items outside lab-only folders
        run: |
          if grep -rlE --exclude-dir=private '"verbatim"[[:space:]]*:[[:space:]]*true' data; then
            echo "::error::Items marked verbatim are in files that would be published (listed above). Rewrite them, or move them into a private/ folder."
            exit 1
          fi
      # Every page in the project root is published (see Assemble site below). Each one must keep
      # the do-not-list tag, set light or dark before the stylesheet loads, and have the skip link
      # and the opened-from-a-folder notice. To try it before a push, run the same lines in
      # Git Bash from the project folder.
      - name: Check the pages
        run: |
          bad=0
          miss() { echo "::error file=${1#./}::$2"; bad=1; }
          for f in ./*.html; do
            echo "Checking ${f#./}"
            grep -q '<meta name="robots" content="noindex, nofollow">' "$f" || miss "$f" 'Missing the noindex tag.'
            t=$(grep -n 'assets/js/theme-init.js' "$f" | head -1 | cut -d: -f1 || true)
            s=$(grep -n 'rel="stylesheet"' "$f" | head -1 | cut -d: -f1 || true)
            if [ -z "$t" ] || [ -z "$s" ] || [ "$t" -ge "$s" ]; then miss "$f" 'theme-init.js must load before the stylesheet.'; fi
            grep -q 'class="skip-link"' "$f" || miss "$f" 'Missing the skip link.'
            grep -q "location.protocol === 'file:'" "$f" || miss "$f" 'Missing the opened-from-a-folder notice.'
          done
          exit "$bad"

  deploy:
    name: Deploy
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # Publish only what students need: every page in the project root, assets, and data.
      # Docs, schemas, and teacher tools stay in the repo. Any page left in the project root
      # is published, so never leave a test page there.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R ./*.html assets data _site/
          # Lab-only content never ships to the public site, even if it was committed by mistake.
          find _site/data -type d -name private -prune -exec rm -rf {} +
          find _site/data -name 'manifest.private.json' -delete
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
