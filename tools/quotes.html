<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <base href="../">
  <title>Quote helper · CompTIA Cert Prep</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <script src="assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    .quote-card { display: grid; gap: 0.6rem; }
    .quote-card textarea { width: 100%; min-height: 4.5rem; padding: 0.6rem 0.7rem; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font: inherit; resize: vertical; }
    .quote-card .answer { color: var(--good); font-weight: 600; }
    .quote-card .find { font-family: var(--font-mono); background: var(--surface-2); padding: 0.1rem 0.4rem; border-radius: 4px; }
    .word-count.is-over { color: var(--bad); font-weight: 700; }
    .sticky-bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
  </style>
  <script type="module" src="tools/quotes.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="header-main">
        <a class="brand" href="index.html" title="Home"><svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1z"/></svg><span class="brand-name">Quote helper</span></a>
      </div>
      <div class="header-actions">
        <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch between light and dark mode" title="Light or dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main id="app">
    <div class="wrap loading">Loading…</div>
  </main>
</body>
</html>
