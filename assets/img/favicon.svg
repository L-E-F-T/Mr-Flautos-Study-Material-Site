<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- RJ45 port: a light faceplate, two link lights, the black opening with its latch notch, and four gold pins. Drawn on a 16 x 16 grid so it stays sharp at tab size. The black opening on the light plate is what reads at 16 px; the dark edge keeps the plate visible on light tab bars. A plain port: do not add face parts. -->
  <rect x=".5" y=".5" width="15" height="15" rx="2.5" fill="#D5DBE2" stroke="#4E5A6B"/>
  <rect x="3" y="2" width="3" height="2" rx=".5" fill="#16A34A"/>
  <rect x="10" y="2" width="3" height="2" rx=".5" fill="#D97706"/>
  <path d="M3 6H13V12H10V14H6V12H3Z" fill="#07090D"/>
  <path d="M4 6h1v2H4zM6 6h1v2H6zM9 6h1v2H9zM11 6h1v2h-1z" fill="#F5C542"/>
</svg>
