<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Flashcards · CompTIA Cert Prep</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <!-- Sets light or dark mode before anything is drawn. Keep it above the stylesheet. -->
  <script src="assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="assets/css/site.css">
  <script type="module" src="assets/js/pages/flashcards.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>

  <header class="site-header has-exam">
    <div class="wrap header-inner">
      <div class="header-main">
        <a class="brand" href="index.html" title="Home"><svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1z"/></svg><span class="brand-name" data-site-title>CompTIA Cert Prep</span></a>
        <div class="exam-title" data-exam-title hidden><strong data-exam-name></strong><span class="exam-code" data-exam-code></span></div>
      </div>
      <nav class="mode-nav" aria-label="Study mode">
        <a data-mode="flashcards" href="flashcards.html" aria-current="page">Flashcards</a>
        <a data-mode="practice" href="practice.html">Practice test</a>
      </nav>
      <div class="header-actions">
        <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch between light and dark mode" title="Light or dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="app">
    <div class="wrap loading">Loading…</div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Not affiliated with CompTIA. CompTIA, A+, Network+, and Security+ are trademarks of CompTIA, Inc.</p>
    </div>
  </footer>

  <script>
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML = '<div class="wrap error-box"><div class="notice notice-bad">This site has to be opened through a web server. Double-click <strong>serve.cmd</strong> in the project folder, then go to <strong>http://localhost:8080/</strong>.</div></div>';
    }
  </script>
</body>
</html>
